<!DOCTYPE html>
<html lang="en" ng-app="pdfViewerApp" ng-csp="no-unsafe-eval">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Naveen PDF Editor</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/pdf-viewer.css">
</head>
<body>
    <div class="app" ng-controller="PdfViewerController as vm" tool-tips ng-class="{'is-fullscreen': vm.fullScreen}">
        <div class="app-body" ng-controller="ToolsController as tools">
            <div class="app-body" ng-controller="FindController as find">
                <div class="app-body" ng-controller="OcrController as ocr">
                    <div class="app-body" ng-controller="SecurityController as sec" ng-include="'app/views/pdf-viewer.html'"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="lib/angular.min.js"></script>
    <script src="lib/pdf.min.js"></script>
    <script src="lib/tesseract/tesseract.min.js"></script>
    <script src="app/app.js"></script>
    <script src="app/services/pdfService.js"></script>
    <script src="app/services/highlightService.js"></script>
    <script src="app/services/scaleService.js"></script>
    <script src="app/services/markupGeometry.js"></script>
    <script src="app/services/compareService.js"></script>
    <script src="app/services/revisionService.js"></script>
    <script src="app/services/reportService.js"></script>
    <script src="app/services/customMarkupService.js"></script>
    <script src="app/services/themeService.js"></script>
    <script src="app/services/desktopService.js"></script>
    <script src="app/services/toolsService.js"></script>
    <script src="app/services/pagesService.js"></script>
    <script src="app/services/printService.js"></script>
    <script src="app/services/recentFilesService.js"></script>
    <script src="app/services/ocrService.js"></script>
    <script src="app/services/searchService.js"></script>
    <script src="app/services/securityService.js"></script>
    <script src="app/services/tourService.js"></script>
    <script src="app/directives/fileInputDirective.js"></script>
    <script src="app/directives/menuBarDirective.js"></script>
    <script src="app/directives/pdfViewerDirective.js"></script>
    <script src="app/directives/thumbnailsDirective.js"></script>
    <script src="app/directives/colorPickerDirective.js"></script>
    <script src="app/directives/toolTipsDirective.js"></script>
    <script src="app/directives/tourDirective.js"></script>
    <script src="app/controllers/pdfViewerController.js"></script>
    <script src="app/controllers/toolsController.js"></script>
    <script src="app/controllers/findController.js"></script>
    <script src="app/controllers/ocrController.js"></script>
    <script src="app/controllers/securityController.js"></script>
</body>
</html>

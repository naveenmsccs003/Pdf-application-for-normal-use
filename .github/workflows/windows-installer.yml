# Builds the Windows installer (NaveenPdfEditor-Setup-<version>.exe) on a Windows machine, which has Inno Setup.
# Runs on every push to main that touches the app, on version tags (v1.0.0: also attached to a GitHub release), and on
# demand (Actions > Windows installer > Run workflow). Download the installer from the run's "Artifacts".
name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['desktop/**', 'frontend/**', 'shared/**', 'installer/**', 'THIRD-PARTY-NOTICES.txt', '.github/workflows/windows-installer.yml']
  workflow_dispatch:

permissions:
  contents: write   # to attach the installer to a release for version tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read the version from the desktop project
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content desktop/PdfViewer.Desktop.csproj
          $version = ($project.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish the desktop app (self-contained, win-x64)
        run: dotnet publish desktop -c Release -r win-x64 --self-contained -o dist/NaveenPdfEditor-win-x64

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build the installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" installer\NaveenPdfEditor.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: NaveenPdfEditor-Setup-${{ steps.version.outputs.version }}
          path: dist/NaveenPdfEditor-Setup-*.exe
          if-no-files-found: error

      - name: Attach to the GitHub release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NaveenPdfEditor-Setup-*.exe
